<svg xmlns="http://www.w3.org/2000/svg" width="380" height="64" viewBox="0 0 380 64" role="img" aria-label="Open the Orbit website">
  <title>Open the Orbit website</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4A3D"/>
      <stop offset="1" stop-color="#D91E12"/>
