    <animate attributeName="x" values="6;1;6" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="6;1;6" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="width" values="368;378;368" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="height" values="52;62;52" dur="1.6s" repeatCount="indefinite"/>
